[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "wechat-official-account-kit"
version = "0.1.0"
description = "Portable helpers and playbook for AI agents using WeChat Official Account passive replies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LingTai AI" }]
dependencies = [
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "jinja2>=3.1",
]

[project.scripts]
wechat-mp-verify-signature = "wechat_mp_agent_kit.signature:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_mp_agent_kit"]
